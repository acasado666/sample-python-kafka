version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:8.1.3
    container_name: kafka_python
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7bsdf-eAKfl--X25ws'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  #  no backup just 1 copy default is 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 #  no backup just 1 copy default is 3

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      #stored locally: data-files,broker-logs.controller-metadata
      #KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_DIRS: jetbrains://pycharm/navigate/reference?project=python-kafka&path=app%2Flogs  #stored locally: data-files,broker-logs.controller-metadata

    volumes:
      - kafka_kraft:/var/lib/kafka/data

volumes:
  kafka_kraft: